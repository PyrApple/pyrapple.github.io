# Restart the local server after changing this file.

title: pyrapple.gitHub.io
email: davipoir@gmail.com
description: >-
  personal website, gathered research and development projects
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://pyrapple.github.io" # the base hostname & protocol for your site, e.g. http://example.com
github_username: pyrapple

# Build settings
plugins:
  - jekyll-feed

# collections
collections:
  projects:
    output: true

  others:
    output: true

collections_dir: pages

# Pages share the same layout unless their front matter overrides it.
defaults:
  - scope:
      path: "pages"
    values:
      layout: default
  - scope:
      path: ""
      type: projects
    values:
      layout: default
  - scope:
      path: ""
      type: others
    values:
      layout: default

# Local notes and tooling should never appear in the generated site.
# Keep image and audio folders: they also contain work in progress.
exclude:
  - vendor/
  - wip/
  - todo/
  - todo.txt
  - README.md
  - readme.md
  - startJekyllServer.sh
  - recreate-from-scratch.sh
  - AGENTS.md
